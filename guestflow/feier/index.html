<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmeldung zur Feier</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f7f2e9;--karte:#fff;--text:#2b2118;--grau:#6f6255;--linie:#e6d8c2;--akzent:#56653a;--fehler:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 60px}
.kopf{text-align:center;margin-bottom:18px}.kopf img{max-height:64px;max-width:200px;background:#fff;border-radius:12px;padding:6px 10px}
h1{font-family:Georgia,serif;font-weight:500;font-size:28px;margin:10px 0 4px}.grau{color:var(--grau)}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:18px;margin:14px 0}
label{display:block;font-weight:600;margin:14px 0 6px}input,textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid #cdbfa8;border-radius:10px;background:#fff;color:var(--text)}
textarea{min-height:70px}.wahl{display:flex;gap:8px}.wahl button{flex:1}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:13px 16px;cursor:pointer}
.haupt{background:var(--akzent);color:#fff;width:100%;margin-top:18px}.neben{background:#efe6d6;color:var(--text)}
.wahl button[aria-pressed="true"]{background:var(--akzent);color:#fff}
.menue{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--linie);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer;font-weight:400}
.menue input{width:auto;margin-top:5px}.menue small{display:block;color:var(--grau)}
.fehler{color:var(--fehler);margin-top:10px}.klein{font-size:13px;color:var(--grau)}.ok{text-align:center}.ok b{font-size:22px;display:block;margin:8px 0}
</style></head>
<body><main id="app"><p class="grau" style="text-align:center">Wird geladen …</p></main><footer style="text-align:center;font-size:12px;color:#8a7a66;padding:0 16px 30px"><a href="../../impressum.html" style="color:inherit">Impressum</a> · <a href="../../datenschutz.html#guestflow" style="color:inherit">Datenschutz</a></footer>
<script>
(function () {
  var URL_ = 'https://zohdlnsznsmoedsnamcn.supabase.co', KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvaGRsbnN6bnNtb2Vkc25hbWNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTIwOTAsImV4cCI6MjEwMDU4ODA5MH0.CSlI87ec29PveyjRUHGFWVsPXTUqirvVlOF0rAfnfdY';
  var token = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rpc(name, body) {
    return fetch(URL_ + '/rest/v1/rpc/' + name, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j && j.message ? j.message : 'Fehler'); return j; }); });
  }
  function datum(d) { if (!d) return ''; var x = new Date(d + 'T12:00:00'); return x.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  if (!/^[0-9a-f-]{36}$/i.test(token)) { app.innerHTML = '<div class="karte">Dieser Link ist unvollständig. Bitte den Link aus der Einladung vollständig öffnen.</div>'; return; }
  rpc('feier_anmeldung_info', { p_token: token }).then(function (f) {
    if (!f) { app.innerHTML = '<div class="karte">Dieser Link ist nicht (mehr) gültig.</div>'; return; }
    document.title = 'Anmeldung: ' + f.anlass;
    var kopf = '<div class="kopf">' + (f.logo ? '<img src="' + esc(f.logo) + '" alt="' + esc(f.hotel) + '">' : '<div class="grau">' + esc(f.hotel) + '</div>') +
      '<h1>' + esc(f.anlass) + '</h1><div class="grau">' + esc(datum(f.datum)) + (f.uhrzeit ? ', ' + esc(f.uhrzeit) : '') + ' · ' + esc(f.hotel) + '</div></div>';
    if (!f.offen) { app.innerHTML = kopf + '<div class="karte">Die Anmeldung ist geschlossen. Bitte wenden Sie sich direkt an ' + esc(f.gastgeber || 'den Gastgeber') + '.</div>'; return; }
    var opt = f.optionen || [];
    app.innerHTML = kopf + '<form class="karte" id="form" novalidate>' +
      (f.hinweis ? '<p>' + esc(f.hinweis).replace(/\n/g, '<br>') + '</p>' : '<p>' + esc(f.gastgeber || 'Der Gastgeber') + ' freut sich auf Sie. Bitte melden Sie sich hier an' + (f.schluss ? ' – bis ' + esc(datum(f.schluss)) : '') + '.</p>') +
      '<div class="wahl" role="group" aria-label="Zu- oder Absage"><button type="button" class="neben" data-z="1" aria-pressed="true">Ich komme</button><button type="button" class="neben" data-z="0" aria-pressed="false">Ich kann leider nicht</button></div>' +
      '<label for="name">Ihr Name</label><input id="name" autocomplete="name" maxlength="80" required>' +
      '<div id="nurZusage"><label for="pers">Anzahl Personen (inkl. Ihnen)</label><select id="pers">' + [1,2,3,4,5,6,7,8].map(function (n) { return '<option>' + n + '</option>'; }).join('') + '</select>' +
      (opt.length ? '<label>Menü</label>' + opt.map(function (o, i) { return '<label class="menue"><input type="radio" name="menue" value="' + esc(o.name) + '"' + (i === 0 && opt.length === 1 ? ' checked' : '') + '><span>' + esc(o.name) + (o.beschreibung ? '<small>' + esc(o.beschreibung) + '</small>' : '') + '</span></label>'; }).join('') +
        '<p class="klein">Kommen Sie zu mehreren mit unterschiedlichen Menüs? Dann bitte jede Person einzeln anmelden.</p>' : '') +
      '<label for="allerg">Allergien / Unverträglichkeiten <span class="klein">(freiwillig)</span></label><input id="allerg" maxlength="300" placeholder="z. B. Nüsse, laktosefrei, vegetarisch"></div>' +
      '<label for="notiz">Nachricht <span class="klein">(freiwillig)</span></label><textarea id="notiz" maxlength="300"></textarea>' +
      '<div id="fehler" class="fehler" role="alert"></div>' +
      '<button class="haupt" id="senden">Anmelden</button>' +
      '<p class="klein">Ihre Angaben erhält nur ' + esc(f.hotel) + ' für die Planung dieser Feier (Küche und Service). Angaben zu Allergien sind freiwillig und dienen nur dazu, Ihr Essen sicher zuzubereiten.</p></form>';
    var zusage = true;
    document.querySelectorAll('[data-z]').forEach(function (b) {
      b.onclick = function () {
        zusage = b.dataset.z === '1';
        document.querySelectorAll('[data-z]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        document.getElementById('nurZusage').style.display = zusage ? '' : 'none';
        document.getElementById('senden').textContent = zusage ? 'Anmelden' : 'Absage senden';
      };
    });
    document.getElementById('form').onsubmit = function (e) {
      e.preventDefault();
      var fehler = document.getElementById('fehler'), btn = document.getElementById('senden');
      var name = document.getElementById('name').value.trim();
      var m = document.querySelector('input[name="menue"]:checked');
      if (!name) { fehler.textContent = 'Bitte Ihren Namen angeben.'; return; }
      if (zusage && opt.length && !m) { fehler.textContent = 'Bitte ein Menü auswählen.'; return; }
      fehler.textContent = ''; btn.disabled = true; btn.textContent = 'Wird gesendet …';
      rpc('feier_anmelden', { p_token: token, p_name: name, p_personen: +document.getElementById('pers').value, p_menue: m ? m.value : null,
        p_allergien: document.getElementById('allerg').value, p_notiz: document.getElementById('notiz').value, p_zusage: zusage })
        .then(function () {
          app.innerHTML = kopf + '<div class="karte ok"><div style="font-size:40px">' + (zusage ? '🎉' : '💌') + '</div><b>' + (zusage ? 'Danke, Sie sind angemeldet!' : 'Danke für Ihre Rückmeldung.') + '</b>' +
            '<p class="grau">' + (zusage ? 'Wir freuen uns auf Sie am ' + esc(datum(f.datum)) + '.' : 'Schade, dass Sie nicht dabei sein können.') + '</p></div>';
        })
        .catch(function (err) { fehler.textContent = err.message || 'Das hat nicht geklappt. Bitte noch einmal versuchen.'; btn.disabled = false; btn.textContent = zusage ? 'Anmelden' : 'Absage senden'; });
    };
  }).catch(function () { app.innerHTML = '<div class="karte">Die Seite konnte nicht geladen werden. Bitte später noch einmal versuchen.</div>'; });
})();
</script></body></html>
