<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie war's?</title><meta name="robots" content="noindex">
<style>
:root{--bg:#f7f2e9;--text:#2b2118;--grau:#6f6255;--linie:#e6d8c2;--akzent:#6b4a2b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px 50px}.kopf{text-align:center}.kopf img{max-height:60px;max-width:200px;background:#fff;border-radius:12px;padding:6px 10px}
h1{font-family:Georgia,serif;font-weight:500;font-size:28px;margin:10px 0 4px}.grau{color:var(--grau)}
.karte{background:#fff;border:1px solid var(--linie);border-radius:14px;padding:18px;margin:14px 0}
.sterne{display:flex;justify-content:center;gap:6px;margin:8px 0}.sterne button{font-size:36px;background:none;border:0;cursor:pointer;color:#d8cbb6;padding:2px}
.sterne button.an{color:#e0a100}.klein .sterne button{font-size:24px}.zeile{display:flex;justify-content:space-between;align-items:center}
textarea,input{width:100%;font:inherit;padding:11px 12px;border:1px solid #cdbfa8;border-radius:10px;margin:6px 0}textarea{min-height:90px}
.knopf{display:block;width:100%;text-align:center;background:var(--akzent);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:12px;border:0;font-size:16px;cursor:pointer;margin-top:10px}
.zweit{background:#fff;color:var(--akzent);border:2px solid var(--akzent)}.fehler{color:#b3261e}.mini{font-size:13px;color:var(--grau)}
</style></head><body><main id="app"><p class="grau" style="text-align:center">Wird geladen …</p></main><footer style="text-align:center;font-size:12px;color:#8a7a66;padding:0 16px 30px"><a href="../../impressum.html" style="color:inherit">Impressum</a> · <a href="../../datenschutz.html#guestflow" style="color:inherit">Datenschutz</a></footer>
<script>
(function () {
  var URL_ = 'https://zohdlnsznsmoedsnamcn.supabase.co', KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvaGRsbnN6bnNtb2Vkc25hbWNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwMTIwOTAsImV4cCI6MjEwMDU4ODA5MH0.CSlI87ec29PveyjRUHGFWVsPXTUqirvVlOF0rAfnfdY';
  var q = new URLSearchParams(location.search), slug = q.get('hotel') || '', tisch = q.get('tisch') || '';
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  if (!/^[a-z0-9-]{3,80}$/.test(slug)) { app.innerHTML = '<div class="karte">Dieser Link ist unvollständig.</div>'; return; }
  var h = { 'apikey': KEY, Authorization: 'Bearer ' + KEY };
  fetch(URL_ + '/rest/v1/hotels?slug=eq.' + encodeURIComponent(slug) + '&select=name,logo_url,brand_color,google_review_url&limit=1', { headers: h })
    .then(function (r) { return r.json(); }).then(function (rows) {
      var ho = rows && rows[0];
      if (!ho) { app.innerHTML = '<div class="karte">Nicht gefunden.</div>'; return; }
      if (/^#[0-9a-fA-F]{6}$/.test(ho.brand_color || '')) document.documentElement.style.setProperty('--akzent', ho.brand_color);
      var kopf = '<div class="kopf">' + (ho.logo_url ? '<img src="' + esc(ho.logo_url) + '" alt="' + esc(ho.name) + '">' : '') + '<h1>Wie war\'s?</h1><div class="grau">Ihre Meinung hilft uns – dauert nur 20 Sekunden.</div></div>';
      var werte = { gesamt: 0, essen: 0, service: 0 };
      function sterne(name, gross) { return '<div class="sterne" data-s="' + name + '">' + [1,2,3,4,5].map(function (i) { return '<button type="button" data-v="' + i + '" aria-label="' + i + ' Sterne">★</button>'; }).join('') + '</div>'; }
      app.innerHTML = kopf + '<form class="karte" id="f">' +
        '<div style="text-align:center"><b>Insgesamt</b></div>' + sterne('gesamt') +
        '<div class="klein"><div class="zeile"><span>Essen</span>' + sterne('essen') + '</div><div class="zeile"><span>Service</span>' + sterne('service') + '</div></div>' +
        '<textarea id="t" maxlength="1000" placeholder="Was hat Ihnen gefallen? Was können wir besser machen? (freiwillig)"></textarea>' +
        '<input id="k" maxlength="120" placeholder="E-Mail oder Telefon, falls wir uns melden dürfen (freiwillig)">' +
        '<div id="e" class="fehler"></div><button class="knopf" id="s">Absenden</button>' +
        '<p class="mini">Ihre Bewertung geht direkt an das Team vom ' + esc(ho.name) + ' und wird nicht veröffentlicht.</p></form>';
      document.querySelectorAll('[data-s]').forEach(function (g) {
        g.querySelectorAll('button').forEach(function (b) {
          b.onclick = function () {
            var v = +b.dataset.v; werte[g.dataset.s] = v;
            g.querySelectorAll('button').forEach(function (x) { x.classList.toggle('an', +x.dataset.v <= v); });
          };
        });
      });
      document.getElementById('f').onsubmit = function (ev) {
        ev.preventDefault();
        var e = document.getElementById('e'), s = document.getElementById('s');
        if (!werte.gesamt) { e.textContent = 'Bitte oben 1 bis 5 Sterne antippen.'; return; }
        s.disabled = true; e.textContent = '';
        fetch(URL_ + '/rest/v1/rpc/restaurant_bewerten', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, h),
          body: JSON.stringify({ p_slug: slug, p_sterne: werte.gesamt, p_essen: werte.essen, p_service: werte.service, p_text: document.getElementById('t').value, p_tisch: tisch, p_kontakt: document.getElementById('k').value }) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || 'Fehler'); return j; }); })
          .then(function (d) {
            var google = d.google || ho.google_review_url;
            app.innerHTML = kopf + '<div class="karte" style="text-align:center"><div style="font-size:42px">' + (werte.gesamt >= 4 ? '😊' : '🙏') + '</div><b style="font-size:20px">Vielen Dank!</b>' +
              '<p>' + (werte.gesamt >= 4 ? 'Schön, dass es Ihnen gefallen hat.' : 'Danke für Ihre Offenheit – wir kümmern uns darum.') + '</p>' +
              (google ? '<p class="mini">Möchten Sie Ihre Erfahrung auch öffentlich teilen? Darüber freuen wir uns – egal wie Ihre Bewertung ausfällt.</p><a class="knopf zweit" href="' + esc(google) + '" target="_blank" rel="noopener">Auf Google bewerten</a>' : '') + '</div>';
          })
          .catch(function (x) { e.textContent = x.message; s.disabled = false; });
      };
    }).catch(function () { app.innerHTML = '<div class="karte">Die Seite konnte nicht geladen werden.</div>'; });
})();
</script></body></html>
