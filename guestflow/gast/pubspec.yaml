name: hotel_restaurant_app
description: Hotel- und Restaurant-App
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Zahlungen
  flutter_stripe: ^11.1.0

  # Push
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4

  # Offline-Cache
  drift: ^2.19.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI
  cached_network_image: ^3.4.0
  intl: 0.20.2
  shimmer: ^3.0.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.19.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8A6D3B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
