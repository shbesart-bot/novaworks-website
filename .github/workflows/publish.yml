name: Publish NovaWorks website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # GitHub findet das gerade hochgeladene Paket manchmal nicht sofort –
      # dann kurz warten und ein zweites Mal veröffentlichen.
      - name: Deploy to Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Deploy to Pages (2. Versuch)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
