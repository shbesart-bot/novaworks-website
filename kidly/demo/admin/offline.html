<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kidly Admin – offline</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc; color: #0f172a; padding: 24px; box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f172a; color: #f1f5f9; }
  }
  .card { max-width: 360px; text-align: center; }
  .icon {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 16px;
    background: #2563eb; color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; line-height: 1.5; color: #64748b; margin: 0 0 20px; }
  @media (prefers-color-scheme: dark) { p { color: #94a3b8; } }
  button {
    border: none; border-radius: 10px; background: #2563eb; color: #fff;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">K</div>
    <h1>Keine Verbindung</h1>
    <p>Kidly Admin braucht gerade eine Internetverbindung, um aktuelle Daten zu laden. Sobald du wieder online bist, einfach erneut versuchen.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
