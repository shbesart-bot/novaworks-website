<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b45309">
<title>PassFort – Abnahme & Fensterpass</title>
<link rel="manifest" href="./passfort.webmanifest">
<link rel="icon" href="./icon-passfort.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-passfort-180.png">
<link rel="stylesheet" href="./fb.css?v=2026-11-04a">
<style>
  .ck { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .ck:first-child { border-top: 0; }
  .ck .seg button { padding: 6px 10px; min-height: 36px; font-size: 13px; }
  .ck .seg button[aria-pressed="true"][data-v="ok"] { background: var(--ok-soft); color: var(--ok); }
  .ck .seg button[aria-pressed="true"][data-v="mangel"] { background: var(--crit-soft); color: var(--crit); }
  .ck textarea { grid-column: 1 / -1; }
  .step { width: 28px; height: 28px; border-radius: 9px; background: var(--accent-soft); color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex: none; }
  .pass { border-radius: 16px; padding: 18px; background: linear-gradient(135deg, #1f2937, #0f172a); color: #f8fafc; }
  .pass .qr { background: #fff; padding: 10px; border-radius: 12px; width: 168px; height: 168px; }
  .pass .qr img, .pass .qr canvas { width: 148px !important; height: 148px !important; }
  .mrow { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 8px; align-items: end; }
  @media (max-width: 560px) { .mrow { grid-template-columns: minmax(0, 1fr) auto; } .mrow .fr { grid-column: 1; } }
</style>
</head>
<body>
<main id="app"><div class="skel"></div></main>
<script src="./vendor/supabase.js"></script>
<script src="./fb-core.js?v=2026-11-04a"></script>
<script src="./vendor/qrcode.min.js" defer></script>
<script src="./vendor/jspdf.umd.min.js" defer></script>
<script>
(async () => {
  const { $, $$, esc, toast, errText, fmtDate, fmtDT, uid } = FB;
  try { await FB.init(); } catch (e) { if (e.message !== 'redirect') $('#app').innerHTML = `<div class="card"><p>${esc(errText(e))}</p></div>`; return; }
  FB.header('passfort', 'Abnahme & Fensterpass');
  const app = $('#app');
  const STATUS = { aufmass: ['Aufmaß', ''], angebot: ['Angebot', ''], bestellt: ['Bestellt', ''], montage: ['Montage', 'warn'], abgenommen: ['Abgenommen', 'ok'] };
  const SST = { neu: ['Neu', 'crit'], in_arbeit: ['In Arbeit', 'warn'], erledigt: ['Erledigt', 'ok'] };
  let P = null, tab = 'offen', saveT = null, team = null;

  window.addEventListener('hashchange', route);
  document.addEventListener('fb:synced', e => { if (P && e.detail.id === P.id) { const had = P.pass_token; Object.assign(P, { version: e.detail.version, pass_token: e.detail.pass_token, abgeschlossen_at: e.detail.abgeschlossen_at, status: e.detail.status }); if (!had && P.pass_token) openProjekt(P.id); } });
  route();
  function route() {
    const m = location.hash.match(/^#p=([\w-]+)/);
    if (m) return openProjekt(m[1]);
    P = null; if (location.hash === '#service') tab = 'service'; listView();
  }

  /* ================= Übersicht ================= */
  async function listView() {
    app.innerHTML = `<div class="head"><div><p class="eyebrow">PassFort</p><h1>Abnahme & Service</h1></div>${FB.canEdit() ? '<button class="btn" id="neu">+ Neue Abnahme</button>' : ''}</div>
      <div class="seg" id="tabs" style="margin-bottom:12px">${[['offen', 'Offene Abnahmen'], ['fertig', 'Abgenommen'], ['service', 'Service']].map(([k, l]) => `<button data-t="${k}" aria-pressed="${tab === k}">${l}<span id="cnt-${k}"></span></button>`).join('')}</div>
      <div class="card" id="body"><div class="skel"></div></div>`;
    $$('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; history.replaceState(null, '', tab === 'service' ? '#service' : location.pathname + location.search); listView(); });
    $('#neu')?.addEventListener('click', async () => { const p = FB.neuesProjekt(); p.status = 'montage'; p.nummer = 'M-' + FB.today().replace(/-/g, '').slice(2) + '-' + Math.random().toString(36).slice(2, 5).toUpperCase(); await FB.saveProjekt(p); location.hash = '#p=' + p.id; });
    const [list, svc] = await Promise.all([FB.listProjekte().catch(() => []), FB.listService().catch(() => [])]);
    const offen = list.filter(p => !p.abgeschlossen_at && ['bestellt', 'montage'].includes(p.status) || (!p.abgeschlossen_at && p.abnahme?.begonnen)), fertig = list.filter(p => p.abgeschlossen_at);
    const neu = svc.filter(s => s.status === 'neu').length;
    $('#cnt-offen').textContent = offen.length ? ` (${offen.length})` : ''; $('#cnt-service').textContent = neu ? ` (${neu} neu)` : '';
    const body = $('#body');
    if (tab === 'service') return serviceList(svc, list);
    const l = tab === 'offen' ? offen : fertig;
    const rest = tab === 'offen' ? list.filter(p => !p.abgeschlossen_at && !offen.includes(p)) : [];
    body.innerHTML = (l.length ? `<div class="list">${l.map(row).join('')}</div>` : `<div class="empty">${tab === 'offen' ? 'Keine offenen Abnahmen. Projekte erscheinen hier, sobald sie in ProFitAR auf „Montage“ stehen – oder leg eine neue Abnahme an.' : 'Noch keine abgeschlossenen Abnahmen.'}</div>`)
      + (rest.length ? `<details style="margin-top:12px"><summary class="small muted" style="cursor:pointer">Weitere Projekte aus dem Aufmaß (${rest.length})</summary><div class="list">${rest.map(row).join('')}</div></details>` : '');
    function row(p) { const s = STATUS[p.status] || ['', '']; return `<a class="item" href="#p=${p.id}"><div class="grow"><b>${esc(p.kunde?.name || 'Ohne Kundenname')}</b><span class="small muted">${esc([p.nummer, p.kunde?.adresse].filter(Boolean).join(' · ') || '—')}</span></div><div style="text-align:right"><span class="chip ${s[1]}">${p.abgeschlossen_at ? 'Pass aktiv' : s[0]}</span><div class="tiny muted">${fmtDate(p.abgeschlossen_at || p.updated_at)}</div></div></a>`; }
  }

  /* ================= Service ================= */
  async function serviceList(svc, projekte) {
    const byId = Object.fromEntries(projekte.map(p => [p.id, p]));
    team ||= await FB.listTeam().catch(() => []);
    $('#body').innerHTML = svc.length ? `<div class="list">${svc.map(s => { const p = byId[s.projekt_id], st = SST[s.status]; return `<button class="item" data-s="${s.id}"><div class="grow"><b>${esc(s.name)} · ${esc(p?.nummer || '')}</b><span class="small muted">${esc(s.nachricht.slice(0, 110))}</span></div><div style="text-align:right"><span class="chip ${st[1]}">${st[0]}</span><div class="tiny muted">${fmtDT(s.created_at)}</div></div></button>`; }).join('')}</div>`
      : '<div class="empty">Noch keine Serviceanfragen. Kunden melden sich über den QR-Code im Fensterpass.</div>';
    $$('[data-s]').forEach(b => b.onclick = () => serviceSheet(svc.find(x => x.id === b.dataset.s), byId));
  }
  function serviceSheet(s, byId) {
    const p = byId[s.projekt_id];
    const d = FB.sheet(`<div class="row between"><h2>Serviceanfrage</h2><button class="iconbtn" data-close aria-label="Schließen">✕</button></div>
      <p class="small muted" style="margin-top:4px">${fmtDT(s.created_at)} · ${esc(p ? (p.nummer + ' · ' + (p.kunde?.name || '')) : 'Projekt gelöscht')}</p>
      <div class="note" style="margin-top:12px;white-space:pre-line">${esc(s.nachricht)}</div>
      <div class="kv" style="margin-top:10px"><div><span>Name</span><b>${esc(s.name)}</b></div><div><span>E-Mail</span><b><a href="mailto:${esc(s.email)}?subject=${encodeURIComponent('Ihre Serviceanfrage ' + (p?.nummer || ''))}">${esc(s.email)}</a></b></div>${s.telefon ? `<div><span>Telefon</span><b><a href="tel:${esc(s.telefon.replace(/[^\d+]/g, ''))}">${esc(s.telefon)}</a></b></div>` : ''}${p?.kunde?.adresse ? `<div><span>Adresse</span><b>${esc(p.kunde.adresse)}</b></div>` : ''}</div>
      <div class="grid g2" style="margin-top:12px"><label class="f">Status<select id="sSt">${Object.entries(SST).map(([k, [l]]) => `<option value="${k}" ${s.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="f">Zuständig<select id="sZu"><option value="">niemand</option>${(team || []).filter(t => t.aktiv).map(t => `<option value="${t.user_id}" ${s.zustaendig === t.user_id ? 'selected' : ''}>${esc(t.name || t.email)}</option>`).join('')}</select></label>
        <label class="f span2">Interne Notiz<textarea id="sNo" rows="3">${esc(s.notiz)}</textarea></label></div>
      <div class="row" style="margin-top:12px"><button class="btn" id="sSave">Speichern</button>${p ? `<a class="btn ghost" href="#p=${p.id}" data-close>Projekt öffnen</a>` : ''}${FB.canAdmin() ? '<button class="btn danger" id="sDel">Löschen</button>' : ''}</div>`);
    $('#sSave', d.el).onclick = async () => { try { await FB.updateService(s.id, { status: $('#sSt', d.el).value, zustaendig: $('#sZu', d.el).value || null, notiz: $('#sNo', d.el).value }); toast('Gespeichert'); d.close(); listView(); } catch (e) { toast(errText(e)); } };
    $('#sDel', d.el)?.addEventListener('click', async () => { if (!(await FB.confirmDlg('Serviceanfrage löschen?', 'Löschen', true))) return; try { await FB.deleteService(s.id); d.close(); listView(); } catch (e) { toast(errText(e)); } });
  }

  /* ================= Abnahme ================= */
  async function openProjekt(id) {
    app.innerHTML = '<div class="skel"></div>';
    P = await FB.getProjekt(id);
    if (!P) { app.innerHTML = `<div class="card"><p>Projekt nicht gefunden.</p><a class="btn ghost" href="#">Zur Übersicht</a></div>`; return; }
    if (P.abgeschlossen_at) return doneView();
    const A = P.abnahme || (P.abnahme = {}), k = P.kunde || (P.kunde = {}), L = P.aufmass?.elemente || [], F = FB.S.firma, ro = !FB.canEdit();
    A.datum ||= FB.today(); A.monteur ||= FB.S.me?.name || ''; A.produkt ||= produktVorschlag(L); A.garantie ??= ''; A.checks ||= {}; A.fotos ||= []; A.maengel ||= []; A.montiert ||= {};
    const checks = (F.pruefliste || []).length ? F.pruefliste : FB.DEMO_FIRMA.pruefliste;
    app.innerHTML = `
      <div class="head"><div><p class="eyebrow"><a href="#" style="color:inherit">← Übersicht</a></p><h1>Abnahme ${esc(P.nummer || '')}</h1><p class="muted small">${esc(k.name || '')}${k.adresse ? ' · ' + esc(k.adresse) : ''}</p></div>
        <a class="btn ghost no-print" href="./profitar.html#p=${P.id}">Aufmaß ansehen</a></div>
      <div class="cols"><div>
      <section class="card"><div class="row" style="margin-bottom:12px"><span class="step">1</span><h2 style="margin:0">Projekt & Produkt</h2></div><div class="grid g2">
        <label class="f">Kunde<input data-k="name" value="${esc(k.name)}"></label><label class="f">Projekt-Nr.<input id="nr" value="${esc(P.nummer)}"></label>
        <label class="f span2">Adresse<input data-k="adresse" value="${esc(k.adresse)}"></label>
        <label class="f">Montage abgeschlossen am<input id="aDat" type="date" value="${esc(A.datum)}"></label><label class="f">Monteur/in<input id="aMon" value="${esc(A.monteur)}"></label>
        <label class="f">Fenstersystem / Modell<input id="pMod" value="${esc(A.produkt.modell)}" placeholder="z. B. Kunststoff 82 mm"></label><label class="f">Verglasung<input id="pGl" value="${esc(A.produkt.glas)}"></label>
        <label class="f">Farbe<input id="pFa" value="${esc(A.produkt.farbe)}"></label><label class="f">Garantie / Gewährleistung<input id="aGar" value="${esc(A.garantie)}" placeholder="z. B. 5 Jahre bis ${fmtDate(new Date(Date.now() + 5 * 365.25 * 864e5).toISOString())}"></label>
      </div>
      ${L.length ? `<h3 style="margin:14px 0 6px">Positionen aus dem Aufmaß</h3><div class="stack">${L.map((e, i) => `<label class="check"><input type="checkbox" data-mo="${e.id}" ${A.montiert[e.id] !== false ? 'checked' : ''}><span><b>${i + 1}. ${esc(e.label)}</b> <span class="muted small">${esc(e.type)}${e.anzahl > 1 ? ' · ' + e.anzahl + ' Stk.' : ''}</span></span></label>`).join('')}</div><p class="hint">Haken = montiert. Nicht montierte Positionen erscheinen im Protokoll als offen.</p>` : ''}
      </section>
      <section class="card"><div class="row between" style="margin-bottom:6px"><div class="row"><span class="step">2</span><h2 style="margin:0">Prüfliste</h2></div><span class="chip" id="ckCnt"></span></div>
        <div id="cks">${checks.map((c, i) => { const v = A.checks[c] || {}; return `<div class="ck" data-c="${i}"><span>${esc(c)}</span><div class="seg" role="group" aria-label="${esc(c)}">${[['ok', 'In Ordnung'], ['mangel', 'Mangel'], ['na', 'Entfällt']].map(([k2, l]) => `<button data-v="${k2}" aria-pressed="${v.v === k2}">${l}</button>`).join('')}</div>${v.v === 'mangel' ? `<textarea class="field" rows="2" placeholder="Was ist offen? Wer erledigt es bis wann?">${esc(v.n || '')}</textarea>` : ''}</div>`; }).join('')}</div>
        <p class="hint">Die Punkte legt ihr unter Konto › Betrieb fest.</p></section>
      <section class="card"><div class="row between" style="margin-bottom:10px"><div class="row"><span class="step">3</span><h2 style="margin:0">Fotos</h2></div>
        <div class="row"><label class="btn soft sm">Foto aufnehmen<input type="file" accept="image/*" capture="environment" id="fCam" hidden></label><label class="btn ghost sm">Fotos wählen<input type="file" accept="image/*" multiple id="fPick" hidden></label></div></div>
        <div class="thumbs" id="thumbs"></div></section>
      <section class="card"><div class="row between" style="margin-bottom:10px"><div class="row"><span class="step">4</span><h2 style="margin:0">Restarbeiten</h2></div><button class="btn ghost sm" id="mAdd">+ Eintrag</button></div>
        <div class="stack" id="mList"></div><p class="hint">Mängel aus der Prüfliste werden automatisch übernommen.</p></section>
      </div><div class="stick">
      <section class="card"><div class="row" style="margin-bottom:12px"><span class="step">5</span><h2 style="margin:0">Übergabe an den Kunden</h2></div>
        <label class="f">Name der unterschreibenden Person<input id="uName" value="${esc(A.unterschrift_name || k.name || '')}" autocomplete="off"></label>
        <p class="small muted" style="margin:10px 0 6px">Unterschrift</p><canvas class="sig" id="sig" aria-label="Unterschriftsfeld"></canvas>
        <div class="row between" style="margin-top:6px"><button class="btn ghost sm" id="sigClr">Löschen</button><span class="tiny muted">mit Finger oder Stift unterschreiben</span></div>
        <label class="check" style="margin-top:12px"><input type="checkbox" id="uOk"><span>Der Kunde bestätigt die Abnahme der montierten Elemente ${'<span id="uRest"></span>'}.</span></label>
        <div id="uWarn" class="stack" style="margin-top:10px"></div>
        <button class="btn block" id="done" style="margin-top:12px">Abnahme abschließen & Pass erstellen</button>
        <p class="tiny muted" style="margin-top:8px">Danach ist das Protokoll gesperrt. Die Unterschrift auf dem Bildschirm ist eine einfache elektronische Unterschrift, keine qualifizierte Signatur.</p>
        <button class="btn ghost block" id="pdfDraft" style="margin-top:8px">Entwurf als PDF ansehen</button></section>
      </div></div>`;
    const sv = () => { A.begonnen = true; dirty(); };
    $$('[data-k]').forEach(i => i.oninput = () => { k[i.dataset.k] = i.value; sv(); });
    $('#nr').oninput = e => { P.nummer = e.target.value; sv(); };
    [['aDat', v => A.datum = v], ['aMon', v => A.monteur = v], ['pMod', v => A.produkt.modell = v], ['pGl', v => A.produkt.glas = v], ['pFa', v => A.produkt.farbe = v], ['aGar', v => A.garantie = v], ['uName', v => A.unterschrift_name = v]]
      .forEach(([id, fn]) => $('#' + id).addEventListener('input', e => { fn(e.target.value); sv(); }));
    $$('[data-mo]').forEach(c => c.onchange = () => { A.montiert[c.dataset.mo] = c.checked; sv(); restHint(); });
    $$('#cks .ck').forEach(row => {
      const c = checks[+row.dataset.c];
      const note = () => { let ta = row.querySelector('textarea'); if (A.checks[c]?.v === 'mangel') { if (!ta) { ta = document.createElement('textarea'); ta.className = 'field'; ta.rows = 2; ta.placeholder = 'Was ist offen? Wer erledigt es bis wann?'; ta.value = A.checks[c].n || ''; row.append(ta); ta.focus(); } ta.oninput = () => { A.checks[c].n = ta.value; sv(); mList(); restHint(); }; } else ta?.remove(); };
      row.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { if (ro) return; A.checks[c] = { ...(A.checks[c] || {}), v: b.dataset.v }; row.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b)); note(); ckCount(); mList(); restHint(); sv(); });
      note();
    });
    const ckCount = () => { const n = checks.filter(c => A.checks[c]?.v).length; $('#ckCnt').textContent = `${n} / ${checks.length}`; $('#ckCnt').className = 'chip ' + (n === checks.length ? 'ok' : ''); };
    ckCount();
    const onFiles = async ev => { const fs = [...ev.target.files]; ev.target.value = ''; for (const f of fs.slice(0, 20)) { if (!f.type.startsWith('image/')) continue; try { const b = await FB.compress(f, 1600, .78); const path = await FB.saveFile(P.id, b); A.fotos.push({ pfad: path, text: '', zeit: new Date().toISOString() }); } catch (e) { toast(errText(e)); } } sv(); thumbs(); };
    $('#fCam').onchange = onFiles; $('#fPick').onchange = onFiles;
    async function thumbs() {
      $('#thumbs').innerHTML = A.fotos.length ? A.fotos.map((f, i) => `<figure><img data-i="${i}" alt="Foto ${i + 1}"><input class="field" style="font-size:12px;min-height:30px;padding:4px 6px" data-t="${i}" value="${esc(f.text)}" placeholder="Beschriftung"><button data-x="${i}" aria-label="Foto entfernen">✕</button></figure>`).join('') : '<p class="small muted">Noch keine Fotos. Typisch: Gesamtansicht, Anschlüsse innen/außen, Typenschild, eventuelle Mängel.</p>';
      for (const im of $$('#thumbs img')) im.src = await FB.fileUrl(A.fotos[+im.dataset.i].pfad);
      $$('#thumbs [data-t]').forEach(i => i.oninput = () => { A.fotos[+i.dataset.t].text = i.value; sv(); });
      $$('#thumbs [data-x]').forEach(b => b.onclick = async () => { const f = A.fotos[+b.dataset.x]; if (!(await FB.confirmDlg('Foto entfernen?', 'Entfernen', true))) return; A.fotos.splice(+b.dataset.x, 1); FB.removeFile(f.pfad); sv(); thumbs(); });
    }
    thumbs();
    function mList() {
      const fromChecks = checks.filter(c => A.checks[c]?.v === 'mangel').map(c => `<div class="note crit small">${esc(c)}${A.checks[c].n ? ': ' + esc(A.checks[c].n) : ''}</div>`).join('');
      $('#mList').innerHTML = fromChecks + A.maengel.map((m, i) => `<div class="mrow"><label class="f">Beschreibung<input data-m="${i}" value="${esc(m.text)}" placeholder="z. B. Abdeckkappe fehlt"></label><label class="f fr">Erledigen bis<input type="date" data-mf="${i}" value="${esc(m.frist || '')}"></label><button class="iconbtn" data-md="${i}" aria-label="Eintrag löschen">✕</button></div>`).join('') || '<p class="small muted">Keine Restarbeiten.</p>';
      $$('[data-m]').forEach(i => i.oninput = () => { A.maengel[+i.dataset.m].text = i.value; sv(); restHint(); });
      $$('[data-mf]').forEach(i => i.onchange = () => { A.maengel[+i.dataset.mf].frist = i.value; sv(); });
      $$('[data-md]').forEach(b => b.onclick = () => { A.maengel.splice(+b.dataset.md, 1); sv(); mList(); restHint(); });
    }
    $('#mAdd').onclick = () => { A.maengel.push({ text: '', frist: '' }); mList(); $$('[data-m]').pop()?.focus(); };
    mList();
    function restHint() { const n = offenePunkte().length; $('#uRest').textContent = n ? `mit ${n} offenen Punkt${n === 1 ? '' : 'en'} (siehe Restarbeiten)` : 'ohne offene Punkte'; }
    restHint();
    const pad = signaturePad($('#sig'));
    $('#sigClr').onclick = () => pad.clear();
    $('#pdfDraft').onclick = () => protokollPdf(null).catch(e => toast(errText(e)));
    $('#done').onclick = async () => {
      const miss = [];
      checks.forEach(c => { if (!A.checks[c]?.v) miss.push(`Prüfpunkt offen: ${c}`); });
      if (!$('#uName').value.trim()) miss.push('Name der unterschreibenden Person fehlt.');
      if (pad.empty()) miss.push('Unterschrift fehlt.');
      if (!$('#uOk').checked) miss.push('Bestätigung des Kunden fehlt.');
      $('#uWarn').innerHTML = miss.map(m => `<div class="note warn small">${esc(m)}</div>`).join('');
      if (miss.length) return;
      if (!(await FB.confirmDlg('Abnahme jetzt abschließen? Danach kann das Protokoll nicht mehr geändert werden.', 'Abschließen'))) return;
      const btn = $('#done'); btn.disabled = true; btn.textContent = 'Wird abgeschlossen …';
      try {
        const blob = await pad.blob(), path = await FB.saveFile(P.id, blob, 'png'), zeit = new Date().toISOString();
        A.unterschrift = { pfad: path, name: $('#uName').value.trim(), zeit, geraet: navigator.userAgent.slice(0, 120) };
        A.pflege = F.pflege || '';
        A.hash = await FB.sha256(JSON.stringify({ nummer: P.nummer, kunde: P.kunde, abnahme: { ...A, hash: undefined }, positionen: L.map(e => [e.label, e.type, e.anzahl]) }));
        P.abgeschlossen_at = zeit; P.status = 'abgenommen';
        await FB.saveProjekt(P);
        toast(navigator.onLine || FB.demo ? 'Abnahme abgeschlossen' : 'Gespeichert – der Pass entsteht, sobald wieder Internet da ist.', 4000);
        P = await FB.getProjekt(P.id); doneView();
      } catch (e) { btn.disabled = false; btn.textContent = 'Abnahme abschließen & Pass erstellen'; toast(errText(e)); }
    };
    if (ro) $$('#app input, #app textarea, #app select, #app button:not(#pdfDraft)').forEach(x => { if (!x.closest('.head')) x.disabled = true; });
  }
  function produktVorschlag(L) {
    const uniq = a => [...new Set(a.filter(Boolean))].join(', ');
    return { modell: uniq(L.map(e => e.profil)), glas: uniq(L.map(e => e.glass)), farbe: uniq(L.map(e => e.color + (e.colorAussen ? ' / ' + e.colorAussen : ''))) };
  }
  function offenePunkte() {
    const A = P.abnahme, F = FB.S.firma, checks = F.pruefliste || [], L = P.aufmass?.elemente || [];
    return [...checks.filter(c => A.checks?.[c]?.v === 'mangel').map(c => c + (A.checks[c].n ? ': ' + A.checks[c].n : '')),
      ...(A.maengel || []).filter(m => m.text?.trim()).map(m => m.text + (m.frist ? ` (bis ${fmtDate(m.frist)})` : '')),
      ...L.filter(e => A.montiert?.[e.id] === false).map(e => `Noch nicht montiert: ${e.label}`)];
  }
  function dirty() { clearTimeout(saveT); if (FB.canEdit()) saveT = setTimeout(saveNow, 900); }
  async function saveNow() { clearTimeout(saveT); saveT = null; if (!P || !FB.canEdit() || P.abgeschlossen_at && P.version > 0 && P.pass_token) return; try { await FB.saveProjekt(P); } catch (e) { toast(errText(e)); } }
  window.addEventListener('beforeunload', () => { if (saveT) saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveT) saveNow(); });

  function signaturePad(c) {
    const x = c.getContext('2d'); let drawing = false, has = false, last = null;
    const fit = () => { const r = c.getBoundingClientRect(), d = devicePixelRatio || 1, img = has ? c.toDataURL() : null; c.width = r.width * d; c.height = r.height * d; x.setTransform(d, 0, 0, d, 0, 0); x.lineWidth = 2.4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0f172a'; if (img) { const i = new Image(); i.onload = () => x.drawImage(i, 0, 0, r.width, r.height); i.src = img; } };
    fit(); new ResizeObserver(fit).observe(c);
    const p = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    c.addEventListener('pointerdown', e => { if (!FB.canEdit()) return; drawing = true; last = p(e); c.setPointerCapture(e.pointerId); x.beginPath(); x.arc(last.x, last.y, 1.1, 0, 7); x.fillStyle = '#0f172a'; x.fill(); has = true; });
    c.addEventListener('pointermove', e => { if (!drawing) return; const q = p(e); x.beginPath(); x.moveTo(last.x, last.y); x.lineTo(q.x, q.y); x.stroke(); last = q; has = true; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => c.addEventListener(n, () => { drawing = false; }));
    return { empty: () => !has, clear: () => { x.clearRect(0, 0, c.width, c.height); has = false; }, blob: () => new Promise(r => c.toBlob(r, 'image/png')) };
  }

  /* ================= Abgeschlossen: Pass + Protokoll ================= */
  async function doneView() {
    const A = P.abnahme || {}, k = P.kunde || {}, F = FB.S.firma, url = P.pass_token ? FB.passUrl(P.pass_token) : '';
    const off = offenePunkte();
    app.innerHTML = `
      <div class="head"><div><p class="eyebrow"><a href="#" style="color:inherit">← Übersicht</a></p><h1>Abnahme ${esc(P.nummer || '')}</h1><p class="muted small">${esc(k.name || '')}${k.adresse ? ' · ' + esc(k.adresse) : ''}</p></div><span class="chip ok">abgeschlossen ${fmtDT(P.abgeschlossen_at)}</span></div>
      <div class="cols"><div>
        <section class="card"><h2>Protokoll</h2><div class="kv">
          <div><span>Montage am</span><b>${fmtDate(A.datum)}</b></div><div><span>Monteur/in</span><b>${esc(A.monteur || '—')}</b></div><div><span>System</span><b>${esc(A.produkt?.modell || '—')}</b></div>
          <div><span>Verglasung</span><b>${esc(A.produkt?.glas || '—')}</b></div><div><span>Farbe</span><b>${esc(A.produkt?.farbe || '—')}</b></div><div><span>Garantie</span><b>${esc(A.garantie || '—')}</b></div>
          <div><span>Unterschrift</span><b>${esc(A.unterschrift?.name || '—')}</b></div><div><span>Fotos</span><b>${(A.fotos || []).length}</b></div></div>
          ${off.length ? `<h3 style="margin:14px 0 6px">Offene Punkte</h3><div class="stack">${off.map(o => `<div class="note warn small">${esc(o)}</div>`).join('')}</div>` : '<p class="note ok" style="margin-top:12px">Ohne offene Punkte abgenommen.</p>'}
          <div class="row" style="margin-top:14px"><button class="btn" id="pdf">Abnahmeprotokoll (PDF)</button><a class="btn ghost" href="./profitar.html#p=${P.id}">Aufmaß</a></div>
          <p class="tiny muted" style="margin-top:8px">Prüfsumme: <span class="tnum" style="overflow-wrap:anywhere">${esc(A.hash || '—')}</span></p></section>
      </div><div class="stick">
        <section class="pass"><div class="row between"><div><p style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.75">Digitaler Fensterpass</p><h2 style="color:#fff;margin-top:4px">${esc(F.name)}</h2><p style="opacity:.8;font-size:13px">${esc(P.nummer || '')}</p></div>${F.logo ? `<img src="${esc(F.logo)}" alt="" style="max-height:40px;max-width:110px;background:#fff;border-radius:8px;padding:4px">` : ''}</div>
          <div class="row" style="margin-top:14px;gap:16px;align-items:flex-start"><div class="qr" id="qr">${url ? '' : '<p style="color:#0f172a;font-size:13px;padding:10px">Der QR-Code erscheint, sobald die Abnahme gespeichert ist (Internet nötig).</p>'}</div>
            <div style="flex:1;min-width:160px;font-size:14px"><p>Kunden scannen den Code und finden Produktdaten, Pflegehinweise und den direkten Weg zu eurem Service.</p><p style="margin-top:8px;opacity:.75;font-size:12px">Ohne Kundenname oder Adresse – die Seite zeigt nur Produkt- und Kontaktdaten eures Betriebs.</p></div></div></section>
        <div class="row" style="margin-top:12px">${url ? `<button class="btn" id="label">QR-Aufkleber (PDF)</button><button class="btn ghost" id="copy">Link kopieren</button><a class="btn ghost" href="${esc(url)}" target="_blank" rel="noopener">Pass ansehen</a>` : ''}</div>
      </div></div>`;
    $('#pdf').onclick = () => protokollPdf(url).catch(e => toast(errText(e)));
    $('#copy')?.addEventListener('click', async () => { try { await navigator.clipboard.writeText(url); toast('Link kopiert'); } catch { toast(url, 6000); } });
    $('#label')?.addEventListener('click', () => labelPdf(url).catch(e => toast(errText(e))));
    if (url) { await qrReady(); new QRCode($('#qr'), { text: url, width: 148, height: 148, correctLevel: QRCode.CorrectLevel.M }); }
  }
  const qrReady = () => new Promise(r => { const t = () => window.QRCode ? r() : setTimeout(t, 50); t(); });
  async function qrDataUrl(text, size = 512) { await qrReady(); const d = document.createElement('div'); new QRCode(d, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); await new Promise(r => setTimeout(r, 30)); const c = d.querySelector('canvas'); return c ? c.toDataURL('image/png') : d.querySelector('img')?.src; }

  async function protokollPdf(url) {
    await new Promise(r => { const t = () => window.jspdf ? r() : setTimeout(t, 50); t(); });
    if (!url) await saveNow();
    toast('PDF wird erstellt …');
    const doc = await FB.pdf(), F = FB.S.firma, A = P.abnahme || {}, k = P.kunde || {}, L = P.aufmass?.elemente || [], W = 210, M = 16, checks = F.pruefliste || [];
    const font = (s, b) => { doc.setFont(doc.getFontList().Noto ? 'Noto' : 'helvetica', b ? 'bold' : 'normal'); doc.setFontSize(s); };
    let y = 0;
    const headr = () => { let x = M; if (F.logo && /^data:image\/(png|jpe?g)/.test(F.logo)) { try { const pr = doc.getImageProperties(F.logo); const h = 12, w = Math.min(40, h * pr.width / pr.height); doc.addImage(F.logo, M, 10, w, h); x = M + w + 4; } catch {} } font(11, true); doc.text(F.name || '', x, 15); font(8); doc.setTextColor(90); doc.text([F.anschrift, [F.telefon, F.email].filter(Boolean).join(' · ')].filter(Boolean), x, 19.5); doc.setTextColor(0); doc.setDrawColor(200); doc.line(M, 26, W - M, 26); y = 34; };
    const need = h => { if (y + h > 280) { doc.addPage(); headr(); } };
    const kvRow = (a, v) => { font(9, true); const lines = doc.splitTextToSize(String(v || '—'), W - 2 * M - 52); need(lines.length * 4.5 + 1); doc.text(a, M, y); font(9); doc.text(lines, M + 52, y); y += lines.length * 4.5 + 1.5; };
    const sec = t => { need(14); y += 3; font(11, true); doc.text(t, M, y); y += 6; };
    headr(); font(18, true); doc.text(url ? 'Abnahmeprotokoll' : 'Abnahmeprotokoll – ENTWURF', M, y + 4); y += 12;
    kvRow('Projekt-Nr.', P.nummer); kvRow('Kunde', k.name); kvRow('Baustelle', k.adresse); kvRow('Montage abgeschlossen', fmtDate(A.datum)); kvRow('Monteur/in', A.monteur);
    sec('Produkt'); kvRow('System / Modell', A.produkt?.modell); kvRow('Verglasung', A.produkt?.glas); kvRow('Farbe', A.produkt?.farbe); kvRow('Garantie', A.garantie);
    if (L.length) { sec('Positionen'); L.forEach((e, i) => kvRow(`${i + 1}. ${e.label}`.slice(0, 34), `${e.type}${e.anzahl > 1 ? ' · ' + e.anzahl + ' Stk.' : ''} · ${A.montiert?.[e.id] === false ? 'NICHT montiert' : 'montiert'}`)); }
    sec('Prüfliste'); checks.forEach(c => { const v = A.checks?.[c] || {}; kvRow({ ok: 'In Ordnung', mangel: 'Mangel', na: 'Entfällt' }[v.v] || 'offen', c + (v.n ? ' – ' + v.n : '')); });
    const off = offenePunkte(); sec('Restarbeiten / offene Punkte'); if (off.length) off.forEach((o, i) => kvRow(String(i + 1) + '.', o)); else kvRow('—', 'keine');
    if ((A.fotos || []).length) {
      let col = 0; const fw = (W - 2 * M - 6) / 2, fh = fw * .75; need(fh + 22); sec('Fotodokumentation');
      for (const f of A.fotos) { const b = await FB.fileBlob(f.pfad).catch(() => null); if (!b) continue; if (col === 0) need(fh + 8); const du = await FB.blobToDataUrl(b); const x = M + col * (fw + 6); try { const pr = doc.getImageProperties(du); const s = Math.min(fw / pr.width, fh / pr.height); doc.addImage(du, 'JPEG', x, y, pr.width * s, pr.height * s); } catch {} font(7.5); doc.text(doc.splitTextToSize(`${f.text || ''} (${fmtDT(f.zeit)})`, fw), x, y + fh + 3.5); col++; if (col === 2) { col = 0; y += fh + 9; } }
      if (col) y += fh + 9;
    }
    sec('Übergabe'); font(9); const conf = `Der Kunde bestätigt die Abnahme der montierten Elemente ${off.length ? 'mit den oben genannten offenen Punkten' : 'ohne offene Punkte'}.`; need(30); doc.text(doc.splitTextToSize(conf, W - 2 * M), M, y); y += 8;
    if (A.unterschrift?.pfad) { const b = await FB.fileBlob(A.unterschrift.pfad).catch(() => null); if (b) { const du = await FB.blobToDataUrl(b); need(32); doc.addImage(du, 'PNG', M, y, 70, 24); y += 26; } }
    doc.setDrawColor(120); doc.line(M, y, M + 80, y); font(8); doc.text(`${A.unterschrift?.name || ''}${A.unterschrift?.zeit ? ', ' + fmtDT(A.unterschrift.zeit) : ''}`, M, y + 4); y += 10;
    if (url) { const q = await qrDataUrl(url, 400); need(40); doc.addImage(q, 'PNG', W - M - 32, y - 40 > 34 ? y - 40 : y, 32, 32); }
    font(7); doc.setTextColor(110); need(14);
    doc.text(doc.splitTextToSize(`Einfache elektronische Unterschrift auf dem Bildschirm, keine qualifizierte elektronische Signatur.${A.hash ? ' Prüfsumme (SHA-256) des Protokolls: ' + A.hash : ''}`, W - 2 * M - 40), M, y + 4); doc.setTextColor(0);
    const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); font(7.5); doc.setTextColor(120); doc.text(`Abnahmeprotokoll ${P.nummer || ''} · erstellt mit PassFort · Seite ${i}/${n}`, M, 290); doc.setTextColor(0); }
    FB.download(doc.output('blob'), `Abnahme_${FB.safeName(P.nummer)}_${FB.safeName(k.name)}${url ? '' : '_Entwurf'}.pdf`);
  }
  async function labelPdf(url) {
    await new Promise(r => { const t = () => window.jspdf ? r() : setTimeout(t, 50); t(); });
    const F = FB.S.firma, doc = await FB.pdf({ unit: 'mm', format: [90, 55], orientation: 'landscape' }), fam = doc.getFontList().Noto ? 'Noto' : 'helvetica';
    const q = await qrDataUrl(url, 400);
    doc.addImage(q, 'PNG', 4, 6, 40, 40);
    doc.setFont(fam, 'bold'); doc.setFontSize(10); doc.text(doc.splitTextToSize(F.name || '', 40), 47, 10);
    doc.setFont(fam, 'normal'); doc.setFontSize(8); doc.text(['Digitaler Fensterpass', P.nummer || ''], 47, 22);
    doc.setFontSize(7); doc.text(doc.splitTextToSize('Scannen für Pflegehinweise und Service' + (F.telefon ? ' · Tel. ' + F.telefon : ''), 40), 47, 32);
    doc.setFontSize(5.5); doc.setTextColor(110); doc.text(url.replace(/^https:\/\//, ''), 4, 51);
    FB.download(doc.output('blob'), `Fensterpass-QR_${FB.safeName(P.nummer)}.pdf`);
  }
})();
</script>
