<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0369a1">
<title>ProFitAR – Digitales Aufmaß</title>
<link rel="manifest" href="./profitar.webmanifest">
<link rel="icon" href="./icon-profitar.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-profitar-180.png">
<link rel="stylesheet" href="./fb.css?v=2026-11-09b">
<style>
  .elist .item { padding: 10px 8px; border-radius: 10px; }
  .elist .item[aria-current="true"] { background: var(--accent-soft); }
  .pos { width: 30px; height: 30px; border-radius: 9px; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex: none; }
  .warnings { display: flex; flex-direction: column; gap: 6px; }
  .bm { font-size: 22px; font-weight: 700; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
</style>
</head>
<body>
<main id="app"><div class="skel"></div></main>
<script src="./vendor/supabase.js"></script>
<script src="./fb-core.js?v=2026-11-09b"></script>
<script src="./vendor/jspdf.umd.min.js" defer></script>
<script src="./vendor/qrcode.min.js" defer></script>
<script>
(async () => {
  const { $, $$, esc, toast, errText, fmtDate, uid } = FB;
  try { await FB.init(); } catch (e) { if (e.message !== 'redirect') $('#app').innerHTML = `<div class="card"><p>${esc(errText(e))}</p></div>`; return; }
  FB.header('profitar', 'Digitales Aufmaß');
  const app = $('#app');
  const STATUS = { aufmass: ['Aufmaß', 'accent'], angebot: ['Angebot', ''], beauftragt: ['Beauftragt', 'ok'], bestellt: ['Bestellt', 'warn'], montage: ['Montage', 'warn'], abgenommen: ['Abgenommen', 'ok'] };
  const TYPEN = ['Dreh-Kipp-Fenster', 'Festverglasung', 'Stulpfenster (2-flügelig)', 'Kippfenster', 'Balkontür', 'Hebe-Schiebetür', 'Parallel-Schiebe-Kipp-Tür', 'Haustür', 'Nebeneingangstür', 'Rollladen / Sonnenschutz'];
  const OEFF = ['DIN links', 'DIN rechts', 'Kipp', 'fest', 'links + rechts (2-flg.)'];
  const FARBEN = [['Weiß', '#f4f5f2'], ['RAL 7016 Anthrazit', '#3b4148'], ['RAL 9005 Schwarz', '#16181a'], ['Golden Oak', '#b07a3a'], ['Eiche', '#a8794f'], ['Nussbaum', '#6b4529'], ['Cremeweiß', '#ece6d3'], ['andere', '#8a929c']];
  const GLAS = ['2-fach Wärmeschutz', '3-fach Wärmeschutz', '3-fach mit Sicherheitsglas (VSG)', 'Schallschutz', 'Ornamentglas', 'Milchglas / satiniert'];
  const ROLL = ['kein', 'Aufsatzkasten', 'Vorbaukasten', 'Bestand bleibt'];
  let P = null, active = 0, saveT = null, filter = 'alle', search = '';

  window.addEventListener('hashchange', route);
  document.addEventListener('fb:synced', e => { if (P && e.detail.id === P.id) { P.version = e.detail.version; P.pass_token = e.detail.pass_token; if (e.detail.status === 'beauftragt' && P.status !== e.detail.status) { P.status = e.detail.status; const s = $('#status'); if (s) s.value = P.status; toast('Der Kunde hat das Angebot online angenommen – Status: Beauftragt.', 5000); } } });
  route();

  function route() {
    const m = location.hash.match(/^#p=([\w-]+)/);
    if (m) return openProjekt(m[1]);
    P = null; listView();
  }

  /* ================= Projektliste ================= */
  async function listView() {
    app.innerHTML = `<div class="head"><div><p class="eyebrow">Aufmaß</p><h1>Projekte</h1></div>
      <div class="row"><button class="btn ghost" id="sammel" title="Alle angezeigten Projekte als eine Tabelle">Sammel-Bestellliste</button>${FB.canEdit() ? '<button class="btn" id="neu">+ Neues Aufmaß</button>' : ''}</div></div>
      <div class="card"><div class="row" style="margin-bottom:10px"><input class="field" id="q" placeholder="Suchen: Kunde, Adresse, Nummer" value="${esc(search)}" style="margin:0;flex:1;min-width:200px" aria-label="Suchen">
        <div class="seg" id="flt">${[['alle', 'Alle'], ...Object.entries(STATUS).map(([k, v]) => [k, v[0]])].map(([k, l]) => `<button data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}</div></div>
        <div id="list"><div class="skel"></div></div></div>`;
    $('#neu')?.addEventListener('click', neu);
    $('#q').oninput = e => { search = e.target.value; draw(); };
    $$('#flt button').forEach(b => b.onclick = () => { filter = b.dataset.f; $$('#flt button').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
    let list = [];
    try { list = await FB.listProjekte(); } catch (e) { $('#list').innerHTML = `<p class="note crit">${esc(errText(e))}</p>`; return; }
    $('#sammel').onclick = () => { const q = search.trim().toLowerCase(), l = list.filter(p => (filter === 'alle' || p.status === filter) && (!q || [p.nummer, p.kunde?.name, p.kunde?.adresse].join(' ').toLowerCase().includes(q))); if (!l.length) return toast('Keine Projekte in der Auswahl.'); exportCSV(l, `Sammel-Bestellliste_${filter}_${FB.today()}.csv`); };
    draw();
    function draw() {
      const q = search.trim().toLowerCase();
      const l = list.filter(p => (filter === 'alle' || p.status === filter) && (!q || [p.nummer, p.kunde?.name, p.kunde?.adresse].join(' ').toLowerCase().includes(q)));
      $('#list').innerHTML = l.length ? `<div class="list">${l.map(p => { const n = p.aufmass?.elemente?.length || 0, s = STATUS[p.status] || ['', '']; return `<a class="item" href="#p=${p.id}"><span class="pos">${n}</span><div class="grow"><b>${esc(p.kunde?.name || 'Ohne Kundenname')}</b><span class="small muted">${esc([p.nummer, p.kunde?.adresse].filter(Boolean).join(' · ') || '—')}</span></div><div style="text-align:right"><span class="chip ${s[1]}">${s[0]}</span>${lieferChip(p)}<div class="tiny muted">${fmtDate(p.updated_at)}</div></div></a>`; }).join('')}</div>`
        : `<div class="empty">${list.length ? 'Nichts gefunden.' : 'Noch keine Projekte. Leg mit „Neues Aufmaß“ los.'}</div>`;
    }
  }
  async function neu() {
    const p = FB.neuesProjekt(), list = await FB.listProjekte().catch(() => []), y = new Date().getFullYear();
    const nr = list.map(x => (x.nummer || '').match(new RegExp('^A-' + y + '-(\\d+)$'))).filter(Boolean).map(m => +m[1]);
    p.nummer = `A-${y}-${String((nr.length ? Math.max(...nr) : 0) + 1).padStart(3, '0')}`;
    p.aufmass.elemente.push(neuesElement(1));
    await FB.saveProjekt(p); location.hash = '#p=' + p.id;
  }
  function neuesElement(n) {
    return { id: uid(), label: `Position ${n}`, type: 'Dreh-Kipp-Fenster', anzahl: 1, widthPoints: [], heightPoints: [], diagonals: [], installGapMm: 10, bestellB: null, bestellH: null,
      opening: 'DIN links', coupling: 'keine', profil: '', color: 'Weiß', colorHex: '#f4f5f2', colorAussen: '', glass: '3-fach Wärmeschutz', rollladen: 'kein',
      options: { muntins: false, fbInnen: false, fbAussen: false, insekt: false }, notiz: '', foto: null, overlay: null };
  }

  /* ================= Projekt bearbeiten ================= */
  async function openProjekt(id) {
    app.innerHTML = '<div class="skel"></div>';
    P = await FB.getProjekt(id);
    if (!P) { app.innerHTML = `<div class="card"><p>Projekt nicht gefunden.</p><a class="btn ghost" href="#">Zur Liste</a></div>`; return; }
    P.aufmass ||= { elemente: [] }; P.aufmass.elemente ||= [];
    if (!P.aufmass.elemente.length) P.aufmass.elemente.push(neuesElement(1));
    active = Math.min(active, P.aufmass.elemente.length - 1);
    const ro = !FB.canEdit(), k = P.kunde || (P.kunde = {});
    app.innerHTML = `
      <div class="head"><div><p class="eyebrow"><a href="#" style="color:inherit">← Projekte</a></p><h1 id="ttl">${esc(k.name || 'Neues Aufmaß')}</h1></div>
        <div class="row no-print"><select class="field" id="status" style="margin:0;width:auto" aria-label="Status" ${ro ? 'disabled' : ''}>${Object.entries(STATUS).map(([s, [l]]) => `<option value="${s}" ${P.status === s ? 'selected' : ''} ${s === 'abgenommen' ? 'disabled' : ''}>${l}</option>`).join('')}</select>
          <button class="btn ghost" id="more" aria-label="Weitere Aktionen">⋯</button></div></div>
      <div class="cols"><div>
        <section class="card"><h2>Kunde</h2><div class="grid g2">
          <label class="f">Kundenname<input data-k="name" value="${esc(k.name)}" autocomplete="off"></label>
          <label class="f">Projekt-Nr.<input id="nummer" value="${esc(P.nummer)}" autocomplete="off"></label>
          <label class="f span2">Adresse der Baustelle<input data-k="adresse" value="${esc(k.adresse)}" autocomplete="off"></label>
          <label class="f">Telefon<input data-k="telefon" type="tel" value="${esc(k.telefon)}" autocomplete="off"></label>
          <label class="f">E-Mail<input data-k="email" type="email" value="${esc(k.email)}" autocomplete="off"></label>
          <label class="f">Aufmaß am<input id="datum" type="date" value="${esc(P.aufmass.datum || FB.today())}"></label>
          <label class="f">Aufgenommen von<input id="von" value="${esc(P.aufmass.von || FB.S.me?.name || '')}"></label>
          <label class="f span2">Hinweise zur Baustelle<textarea data-k="notiz" rows="2" placeholder="z. B. Altbau, Zugang, Parken, Gerüst">${esc(k.notiz)}</textarea></label>
        </div></section>
        <section class="card"><div class="row between" style="margin-bottom:8px"><h2 style="margin:0">Positionen</h2>${ro ? '' : '<div class="row"><button class="btn ghost sm" id="addTpl">+ aus Vorlage</button><button class="btn soft sm" id="addEl">+ Position</button></div>'}</div><div class="list elist" id="elist"></div></section>
        <section class="card" id="edit"></section>
      </div>
      <div class="stick"><section class="card"><div class="row between"><h2 style="margin:0" id="stTitle">Foto & Visualisierung</h2><span class="chip" id="scaleInfo"></span></div>
        <div class="stage" id="stage" style="margin-top:10px"><img id="ph" alt="" hidden><canvas id="cv" aria-label="Fenster-Visualisierung"></canvas><div class="hintx" id="stHint">Ohne Foto: maßstäbliche Skizze. Mit Foto: Fenster ziehen, Griff unten rechts zum Skalieren.</div></div>
        <div class="tools no-print">
          <label class="btn soft sm">Foto aufnehmen<input type="file" accept="image/*" capture="environment" id="cam" hidden></label>
          <label class="btn ghost sm">Foto wählen<input type="file" accept="image/*" id="pick" hidden></label>
          <button class="btn ghost sm" id="cal">Maßstab: 2 Punkte</button><button class="btn ghost sm" id="persp">Ecken: 4 Punkte</button>
          <button class="btn ghost sm" id="reset">Zurücksetzen</button><button class="btn ghost sm" id="fotoDel">Foto entfernen</button></div>
        <div class="row" style="margin-top:8px"><label class="f" style="flex:1">Referenzmaß für „2 Punkte“ (mm)<input id="refMm" type="number" min="10" value="1000"></label>
          <label class="f" style="flex:1">Deckkraft <span id="opL">70 %</span><input id="op" type="range" min="15" max="100" value="70"></label></div>
        <p class="small muted" id="calSt" style="margin-top:6px"></p>
        <div class="kv" id="sum" style="margin-top:12px"></div></section></div>
      </div>
      <div class="dock no-print"><button class="btn ghost" id="pdfBtn">Aufmaßblatt</button><button class="btn ghost" id="angBtn">Angebot</button><button class="btn" id="toPF">Zur Abnahme</button></div>`;
    $$('[data-k]').forEach(i => i.oninput = () => { k[i.dataset.k] = i.value; if (i.dataset.k === 'name') $('#ttl').textContent = i.value || 'Neues Aufmaß'; dirty(); });
    $('#nummer').oninput = e => { P.nummer = e.target.value; dirty(); };
    $('#datum').onchange = e => { P.aufmass.datum = e.target.value; dirty(); };
    $('#von').oninput = e => { P.aufmass.von = e.target.value; dirty(); };
    $('#status').onchange = e => { P.status = e.target.value; dirty(true); };
    $('#addTpl')?.addEventListener('click', vorlageWaehlen);
    $('#addEl')?.addEventListener('click', () => { P.aufmass.elemente.push(neuesElement(P.aufmass.elemente.length + 1)); active = P.aufmass.elemente.length - 1; renderEl(); dirty(); $('#edit').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    $('#pdfBtn').onclick = () => pdfAufmass().catch(e => toast(errText(e)));
    $('#angBtn').onclick = angebot;
    $('#toPF').onclick = async () => { if (!FB.canEdit()) return (location.href = './passfort.html#p=' + P.id); if (['aufmass', 'angebot', 'beauftragt', 'bestellt'].includes(P.status)) P.status = 'montage'; await saveNow(); location.href = './passfort.html#p=' + P.id; };
    $('#more').onclick = more;
    if (ro) $$('#app input, #app textarea, #app select').forEach(x => x.disabled = true);
    stageInit(); renderEl();
  }
  function dirty(now) { clearTimeout(saveT); if (!FB.canEdit()) return; saveT = setTimeout(saveNow, now ? 10 : 900); }
  async function saveNow() { clearTimeout(saveT); if (!P || !FB.canEdit()) return; try { await FB.saveProjekt(P); } catch (e) { toast(errText(e)); } }
  window.addEventListener('beforeunload', () => { if (saveT) saveNow(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveT) saveNow(); });

  function renderEl() {
    const L = P.aufmass.elemente, ro = !FB.canEdit();
    $('#elist').innerHTML = L.map((e, i) => { const b = bestell(e); return `<button class="item" data-i="${i}" aria-current="${i === active}"><span class="pos">${i + 1}</span><div class="grow"><b>${esc(e.label || 'Position ' + (i + 1))}</b><span class="small muted">${esc(e.type)}${e.anzahl > 1 ? ' · ' + e.anzahl + ' Stück' : ''}${b.B ? ` · ${b.B} × ${b.H} mm` : ' · Maße fehlen'}</span></div>${pruef(e).length ? '<span class="chip warn">prüfen</span>' : b.B ? '<span class="chip ok">✓</span>' : ''}</button>`; }).join('');
    $$('#elist [data-i]').forEach(b => b.onclick = () => { active = +b.dataset.i; renderEl(); });
    const e = L[active], b = bestell(e), sel = (id, opts, v) => `<select id="${id}">${opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    const pts = a => (a || []).join(' / ');
    $('#edit').innerHTML = `<div class="row between" style="margin-bottom:12px"><h2 style="margin:0">Position ${active + 1}</h2>${ro ? '' : `<div class="row">${FB.canAdmin() ? '<button class="btn ghost sm" id="asTpl" title="Diese Position als Vorlage für künftige Aufmaße speichern">Als Vorlage</button>' : ''}<button class="btn ghost sm" id="dup">Duplizieren</button>${L.length > 1 ? '<button class="btn danger sm" id="delEl">Löschen</button>' : ''}</div>`}</div>
      <div class="grid g2">
        <label class="f span2">Bezeichnung / Raum<input id="eLabel" value="${esc(e.label)}" placeholder="z. B. EG Wohnzimmer links"></label>
        <label class="f">Elementtyp${sel('eType', TYPEN, e.type)}</label>
        <label class="f">Stückzahl<input id="eAnz" type="number" min="1" max="99" value="${e.anzahl || 1}"></label>
        <label class="f">Breite oben / Mitte / unten (mm)<input id="eWp" inputmode="decimal" value="${esc(pts(e.widthPoints))}" placeholder="1230 / 1228 / 1231"></label>
        <label class="f">Höhe links / Mitte / rechts (mm)<input id="eHp" inputmode="decimal" value="${esc(pts(e.heightPoints))}" placeholder="1410 / 1412 / 1409"></label>
        <label class="f">Diagonalen (mm)<input id="eDg" inputmode="decimal" value="${esc(pts(e.diagonals))}" placeholder="1868 / 1871"></label>
        <label class="f">Einbaufuge je Seite (mm)<input id="eGap" type="number" min="0" max="60" value="${e.installGapMm ?? 10}"></label>
        <div class="span2 note"><div class="row between"><div><span class="small muted">Bestellmaß (Rahmenaußenmaß)</span><div class="bm tnum" id="bm">${b.B ? `${b.B} × ${b.H} mm` : '—'}</div><span class="tiny muted" id="bmHow">${b.how}</span></div>
          <div class="row"><label class="f" style="width:110px">Breite fest<input id="eBB" type="number" value="${e.bestellB ?? ''}" placeholder="auto"></label><label class="f" style="width:110px">Höhe fest<input id="eBH" type="number" value="${e.bestellH ?? ''}" placeholder="auto"></label></div></div></div>
        <div class="span2 warnings" id="warn"></div>
        ${FB.mitTeilung(e) ? '<div class="span2" id="tlg"></div>' : `<label class="f">Öffnung / Anschlag${sel('eOpen', OEFF, e.opening)}</label>`}
        <label class="f">Kopplung${sel('eCoup', ['keine', 'links', 'rechts', 'oben', 'beidseitig'], e.coupling)}</label>
        <label class="f">Profil / System<input id="eProf" value="${esc(e.profil)}" placeholder="z. B. Kunststoff 82 mm, 6 Kammern"></label>
        <label class="f">Verglasung${sel('eGlass', GLAS, e.glass)}</label>
        <label class="f">U-Wert ${/Tür/.test(e.type) && !/Balkon|Schiebe/.test(e.type) ? 'U<sub>D</sub>' : 'U<sub>w</sub>'} (W/m²K, für Förderung)<input id="eUw" inputmode="decimal" value="${e.uw ?? ''}" placeholder="z. B. 0,92"></label>
        <label class="f">Farbe innen${sel('eColor', FARBEN.map(f => f[0]), e.color)}</label>
        <label class="f">Farbe außen<input id="eColA" value="${esc(e.colorAussen)}" placeholder="wie innen"></label>
        <label class="f">Rollladen${sel('eRoll', ROLL, e.rollladen)}</label>
        <div class="stack" style="justify-content:center">
          <label class="check"><input type="checkbox" id="oMun" ${e.options?.muntins ? 'checked' : ''}>Sprossen</label>
          <label class="check"><input type="checkbox" id="oIns" ${e.options?.insekt ? 'checked' : ''}>Insektenschutz</label></div>
        <label class="check"><input type="checkbox" id="oFbi" ${e.options?.fbInnen ? 'checked' : ''}>Fensterbank innen</label>
        <label class="check"><input type="checkbox" id="oFba" ${e.options?.fbAussen ? 'checked' : ''}>Fensterbank außen</label>
        <label class="f span2">Notiz zur Position<textarea id="eNote" rows="2" placeholder="z. B. Altfenster ausbauen, Anschluss mit Kompriband">${esc(e.notiz)}</textarea></label>
        <div class="span2"><div class="row between" style="margin-bottom:6px"><span class="small muted" style="font-weight:600">Detailfotos (Anschluss, Laibung, Schäden)</span>${ro ? '' : '<div class="row"><label class="btn soft sm">Foto aufnehmen<input type="file" accept="image/*" capture="environment" id="dCam" hidden></label><label class="btn ghost sm">Wählen<input type="file" accept="image/*" multiple id="dPick" hidden></label></div>'}</div>
          <div class="thumbs" id="dThumbs"></div></div>
      </div>`;
    const num = s => String(s || '').replace(/,/g, '.').split(/[\s/;]+/).map(Number).filter(n => Number.isFinite(n) && n > 0).slice(0, 3);
    const bind = (id, fn, ev = 'input') => { const el = $('#' + id); if (el) el.addEventListener(ev, () => { fn(el); upd(); }); };
    const upd = () => { const bb = bestell(e); $('#bm').textContent = bb.B ? `${bb.B} × ${bb.H} mm` : '—'; $('#bmHow').textContent = bb.how; warn(); summary(); draw(); dirty(); const it = $(`#elist [data-i="${active}"]`); if (it) { it.querySelector('b').textContent = e.label || 'Position ' + (active + 1); it.querySelector('.small').textContent = `${e.type}${e.anzahl > 1 ? ' · ' + e.anzahl + ' Stück' : ''}${bb.B ? ` · ${bb.B} × ${bb.H} mm` : ' · Maße fehlen'}`; } };
    bind('eLabel', x => e.label = x.value); bind('eType', x => { const vor = FB.mitTeilung(e); e.type = x.value; if (FB.mitTeilung(e) !== vor) setTimeout(renderEl, 0); else if (FB.mitTeilung(e)) e.opening = FB.oeffnungText(e); }, 'change'); bind('eAnz', x => e.anzahl = Math.max(1, +x.value || 1));
    bind('eWp', x => e.widthPoints = num(x.value)); bind('eHp', x => e.heightPoints = num(x.value)); bind('eDg', x => e.diagonals = num(x.value).slice(0, 2));
    bind('eGap', x => e.installGapMm = Math.max(0, +x.value || 0)); bind('eBB', x => e.bestellB = x.value ? +x.value : null); bind('eBH', x => e.bestellH = x.value ? +x.value : null);
    bind('eOpen', x => e.opening = x.value, 'change'); bind('eCoup', x => e.coupling = x.value, 'change'); bind('eProf', x => e.profil = x.value); bind('eGlass', x => e.glass = x.value, 'change');
    bind('eColor', x => { e.color = x.value; e.colorHex = (FARBEN.find(f => f[0] === x.value) || [0, '#8a929c'])[1]; }, 'change'); bind('eColA', x => e.colorAussen = x.value); bind('eRoll', x => e.rollladen = x.value, 'change');
    e.options ||= {};
    bind('oMun', x => e.options.muntins = x.checked, 'change'); bind('oIns', x => e.options.insekt = x.checked, 'change'); bind('oFbi', x => e.options.fbInnen = x.checked, 'change'); bind('oFba', x => e.options.fbAussen = x.checked, 'change');
    bind('eNote', x => e.notiz = x.value); bind('eUw', x => { const v = parseFloat(String(x.value).replace(',', '.')); e.uw = Number.isFinite(v) && v > 0 && v < 10 ? v : null; });
    $('#asTpl')?.addEventListener('click', () => vorlageSpeichern(e));
    $('#dup')?.addEventListener('click', () => { const c = JSON.parse(JSON.stringify(e)); c.id = uid(); c.label = (e.label || '') + ' (Kopie)'; c.foto = null; c.overlay = null; L.splice(active + 1, 0, c); active++; renderEl(); dirty(); });
    $('#delEl')?.addEventListener('click', async () => { if (!(await FB.confirmDlg(`Position „${e.label}“ löschen?`, 'Löschen', true))) return; if (e.foto) FB.removeFile(e.foto); L.splice(active, 1); active = Math.max(0, active - 1); renderEl(); dirty(true); });
    tlgUI();
    function tlgUI() {
      const box = $('#tlg'); if (!box) return;
      const T = FB.teilung(e), o = (v, list) => list.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
      box.innerHTML = `<div class="note"><div class="row between" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
        <label class="f" style="width:150px;margin:0">Teilung<select id="tN">${[1, 2, 3, 4].map(n => `<option value="${n}" ${n === T.felder.length ? 'selected' : ''}>${n === 1 ? '1 Feld' : n + ' Felder'}</option>`).join('')}</select></label>

    }
    y += 4; font(8.5);
    const gc = FB.girocodeText(r);
    let qrY = null; if (gc && !r.bezahlt_at) { try { if (y + 30 > 272) { doc.addPage(); y = 24; } const q = await qrDataUrl(gc); qrY = y; doc.addImage(q, 'PNG', W - M - 26, y, 26, 26); font(7.5); doc.setTextColor(90); doc.text(['Mit Banking-App', 'scannen'], W - M - 13, y + 29, { align: 'center' }); doc.setTextColor(0); font(8.5); } catch {} }
    const notes = [];
    if (!mw) notes.push('Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.');
    if (!sto && r.faellig) notes.push(`Bitte überweisen Sie den Betrag bis zum ${fmtDate(r.faellig)} ohne Abzug unter Angabe der Rechnungsnummer ${r.nr}.`);
    notes.push('Als Privatperson sind Sie gesetzlich verpflichtet, diese Rechnung, einen Zahlungsbeleg oder eine andere beweiskräftige Unterlage zwei Jahre lang aufzubewahren (§ 14b Abs. 1 Satz 5 UStG).');
    if (Fi.text) notes.push(Fi.text);
    for (const t of notes) { const nw = qrY != null && y < qrY + 36 ? W - 2 * M - 34 : W - 2 * M, tt = doc.splitTextToSize(t, nw); if (y + tt.length * 4.2 > 272) { doc.addPage(); y = 24; qrY = null; } doc.text(tt, M, y); y += tt.length * 4.2 + 1.5; }
    if (qrY != null) y = Math.max(y, qrY + 36);
    const fuss = [[Fi.name, Fi.anschrift].filter(Boolean).join(' · '), [Fi.steuernummer && 'Steuernummer ' + Fi.steuernummer, Fi.ustid && 'USt-IdNr. ' + Fi.ustid].filter(Boolean).join(' · '), [Fi.bank, Fi.iban && 'IBAN ' + Fi.iban, Fi.bic && 'BIC ' + Fi.bic].filter(Boolean).join(' · ')].filter(Boolean);
    const n = doc.getNumberOfPages(); for (let i = 1; i <= n; i++) { doc.setPage(i); font(7.5); doc.setTextColor(110); doc.text(fuss, W / 2, 280, { align: 'center' }); doc.text(`${ART_R[r.art]} ${r.nr} · Seite ${i}/${n}`, W - M, 292, { align: 'right' }); doc.setTextColor(0); }
    return doc.output('blob');
  }
  async function rechnungSenden(r, done) {
    const k = P.kunde || {};
    const d = FB.sheet(`<div class="row between"><h2>${esc(ART_R[r.art])} ${esc(r.nr)} senden</h2><button class="iconbtn" data-close aria-label="Schließen">✕</button></div>
      <p class="small muted" style="margin-top:6px">Der Kunde bekommt die Rechnung als PDF und zusätzlich als E-Rechnung (XRechnung). Antworten gehen an eure Firmen-E-Mail.</p>
      <label class="f" style="margin-top:10px">E-Mail des Kunden<input id="rsM" type="email" value="${esc(r.gesendet_an || k.email || '')}" autocomplete="off"></label>
      <label class="f">Nachricht (optional)<textarea id="rsT" rows="3" placeholder="z. B. vielen Dank für die angenehme Zusammenarbeit"></textarea></label>
      <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" data-close>Abbrechen</button><button class="btn" id="rsGo">Senden</button></div>`);
    $('#rsGo', d.el).onclick = async ev => {
      const email = $('#rsM', d.el).value.trim(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast('Bitte eine gültige E-Mail-Adresse eingeben.');
      ev.target.disabled = true;
      try {
        if (!r.pdf_pfad) { const blob = await rechnungPdf(r); await FB.rechnungPdfAblegen(r, blob); }
        const xml = FB.xrechnungXml({ ...r, gesendet_an: email }), b64 = btoa(String.fromCharCode(...new TextEncoder().encode(xml)));
        if (FB.demo) { await FB.rechnungUpdate(r.id, { gesendet_at: new Date().toISOString(), gesendet_an: email }); d.close(); toast('Demo: nichts versendet, als gesendet vermerkt.'); return done(); }
        await FB.callKunde('rechnung_senden', { rechnung_id: r.id, email, nachricht: $('#rsT', d.el).value.trim(), xml: b64 });
        if (!k.email) { k.email = email; dirty(); }
        d.close(); toast('Rechnung gesendet.'); done();
      } catch (e) { toast(errText(e)); ev.target.disabled = false; }
    };
  }
  const qrReady = () => new Promise(res => { const t = () => window.QRCode ? res() : setTimeout(t, 50); t(); });
  async function qrDataUrl(text, size = 400) { await qrReady(); const box = document.createElement('div'); new QRCode(box, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M }); await new Promise(res => setTimeout(res, 30)); const c = box.querySelector('canvas'); return c ? c.toDataURL('image/png') : box.querySelector('img')?.src; }

  /* CSV im Format, das Kontora unter „Daten übernehmen → Rechnungen (andere Programme)“ erkennt */
  function kontoraCsv(l, name) {
    const weg = l.filter(r => r.art === 'storno' || r.storniert_durch).length; l = l.filter(r => r.art !== 'storno' && !r.storniert_durch);
    if (weg) FB.toast(`${weg} stornierte Rechnung(en) und Storno(s) sind nicht enthalten – sie heben sich auf. Schon nach Kontora übernommen? Dort per Gutschrift ausgleichen.`, 7000);
    if (!l.length) return;
    const q = v => { const t = String(v ?? ''); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }, num = n => (+n || 0).toFixed(2).replace('.', ',');
    const head = ['Rechnungsnummer', 'Rechnungsdatum', 'Fälligkeit', 'Kunde', 'Netto', 'Steuer', 'Brutto', 'Steuersatz', 'Status', 'Bezahlt am', 'Betreff'];
    const rows = l.map(r => [r.nr, fmtDate(r.datum), r.faellig ? fmtDate(r.faellig) : fmtDate(r.datum), r.daten?.kunde?.name || '', num(r.netto), num(r.steuer), num(r.brutto), (r.daten?.firma?.mwst ?? 0) + ' %',
      r.bezahlt_at || r.art === 'storno' || r.storniert_durch ? 'bezahlt' : 'offen', r.bezahlt_at ? fmtDate(r.bezahlt_at) : (r.art === 'storno' || r.storniert_durch ? fmtDate(r.datum) : ''),
      `${ART_R[r.art]}${r.daten?.projekt ? ' ' + r.daten.projekt : ''}${r.daten?.storno_zu ? ' zu ' + r.daten.storno_zu.nr : ''}`].map(q).join(';'));
    FB.download(new Blob(['﻿' + [head.map(q).join(';'), ...rows].join('\r\n')], { type: 'text/csv;charset=utf-8' }), name);
  }

  function more() {
    const d = FB.sheet(`<h2>Projekt ${esc(P.nummer || '')}</h2><div class="stack" style="margin-top:12px">
      <button class="btn" data-a="ang">Angebot erstellen / senden</button>${FB.canAdmin() ? '<button class="btn soft" data-a="re">Rechnungen (Anzahlung, Schluss)</button>' : ''}<button class="btn ghost" data-a="pdf">Aufmaßblatt als PDF</button>
      <button class="btn ghost" data-a="bst">Bestellung beim Hersteller (Lieferstatus)</button><button class="btn ghost" data-a="zm">Zeit & Material (Nachträge)</button><button class="btn ghost" data-a="best">Bestellliste für den Hersteller (PDF)</button><button class="btn ghost" data-a="csv">Bestellliste als Excel-Tabelle (CSV)</button><button class="btn ghost" data-a="json">Export für Branchensoftware (JSON)</button>
      <button class="btn ghost" data-a="ter">Termin planen</button><button class="btn ghost" data-a="pf">In PassFort öffnen (Abnahme)</button>
      ${FB.canAdmin() && FB.canEdit() ? '<button class="btn danger" data-a="del">Projekt löschen</button>' : ''}<button class="btn ghost" data-close>Schließen</button></div>
      <p class="tiny muted" style="margin-top:10px">Der JSON-Export ist eine offene Struktur. Für einen direkten Import in eure Branchensoftware gleichen wir die Felder gern ab.</p>`);
    d.el.addEventListener('click', async ev => {
      const a = ev.target.closest('[data-a]')?.dataset.a; if (!a) return; d.close();
      if (a === 'pdf') pdfAufmass().catch(e => toast(errText(e))); if (a === 'csv') exportCSV(); if (a === 'best') pdfBestellung().catch(e => toast(errText(e))); if (a === 'ang') angebot(); if (a === 're') rechnungen(); if (a === 'bst') bestellung(); if (a === 'zm') FB.nachtraegeDialog(P, () => saveNow()); if (a === 'ter') { saveNow().then(() => location.href = './planung.html#neu=' + P.id); } if (a === 'json') exportJSON(); if (a === 'pf') location.href = './passfort.html#p=' + P.id;
      if (a === 'del') { if ((await FB.listRechnungen(P.id).catch(() => [])).length) return toast('Zu diesem Projekt gibt es Rechnungen – es bleibt wegen der Aufbewahrungspflicht erhalten.', 5000); if (!(await FB.confirmDlg(`Projekt ${P.nummer || ''} mit allen Fotos löschen?`, 'Löschen', true))) return; try { const files = P.aufmass.elemente.flatMap(e => [e.foto, ...(e.fotos || []).map(f => f.pfad)]).filter(Boolean); await FB.deleteProjekt(P.id); files.forEach(f => FB.removeFile(f)); toast('Gelöscht'); location.hash = ''; } catch (e) { toast(errText(e)); } }
    });
  }
})();
